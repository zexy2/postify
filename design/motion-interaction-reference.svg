<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Postify Stage 9 unapproved motion directions</title>
<desc id="desc">M-01 quiet precision 130ms hover and 180ms drawer, M-02 editorial rhythm 160ms hover and 250ms drawer, M-03 kinetic issue 260ms hover and 420ms drawer. Reduced-motion removes decorative movement. These values are proposed and not applied to Postify.</desc>
