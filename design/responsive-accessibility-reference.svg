<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="535" viewBox="0 0 1230 535" role="img" aria-labelledby="title desc">
<title id="title">Postify Stage 10 responsive accessibility pattern comparison</title>
<desc id="desc">R-01 Editorial Reflow uses content-first single column mobile, R-02 Adaptive Marginalia shows contextual evidence on large screens and inline summary mobile, R-03 Task-first Workbench puts controls before art for auth editor admin. All options require WCAG 2.2 AA; none are approved yet.</desc>
